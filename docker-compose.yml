# AtlasLearn local infrastructure — everything runs on your machine:
#   MongoDB (single-node replica set, required by Prisma), Redis, MinIO (S3-compatible file storage).
# Usage (from the repository root): docker compose up -d
#
# To use hosted services later, change the matching variables in AtlasBack/.env
# (DATABASE_URL, REDIS_URL, S3_*) — no code change is needed.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    # Initialises the replica set on first start, then reports healthy.
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  minio:
    # Community build of the MinIO server (the official images are no longer published)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"          # S3 API (files are served from here)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # web console: http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

volumes:
  mongodata:
  redisdata:
  miniodata:
